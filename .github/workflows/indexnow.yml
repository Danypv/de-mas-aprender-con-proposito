name: Avisar cambios publicados a IndexNow

on:
  workflow_run:
    workflows: [pages build and deployment]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-publicaciones
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      INDEXNOW_STATE_FILE: ${{ github.workspace }}/.indexnow-state/state.json
    steps:
      - name: Leer la versión publicada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recuperar el último envío aceptado
        uses: actions/checkout@v4
        with:
          ref: indexnow-state
          path: .indexnow-state
      - name: Comprobar publicación y avisar los cambios
        run: node scripts/notify-indexnow.mjs
      - name: Guardar el último envío aceptado
        working-directory: .indexnow-state
        run: |
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "DE+ IndexNow"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Registrar avisos aceptados de IndexNow"
          git push origin HEAD:indexnow-state
