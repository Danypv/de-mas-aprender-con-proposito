name: Avisar cambios publicados a IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-publicaciones
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      INDEXNOW_STATE_FILE: ${{ github.workspace }}/.indexnow-state/state.json
    steps:
      - name: Leer los cambios que se van a publicar
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recuperar el último envío aceptado
        uses: actions/checkout@v4
        with:
          ref: indexnow-state
          path: .indexnow-state
      - name: Comprobar publicación y avisar los cambios
        run: node scripts/notify-indexnow.mjs
      - name: Guardar el último envío aceptado
        working-directory: .indexnow-state
        run: |
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "DE+ IndexNow"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Registrar avisos aceptados de IndexNow"
          git push origin HEAD:indexnow-state
